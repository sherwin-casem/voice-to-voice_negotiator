<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none" role="img" aria-label="AI interviewer avatar">
  <defs>
    <linearGradient id="bodyGrad" x1="200" y1="80" x2="200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="200" y1="0" x2="200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="faceGlow" cx="200" cy="160" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="420" rx="120" ry="20" fill="#000" opacity="0.25"/>
  <rect x="60" y="40" width="280" height="400" rx="24" fill="url(#glowGrad)" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="200" cy="130" rx="70" ry="80" fill="url(#faceGlow)"/>
  <!-- Eyes -->
  <ellipse cx="170" cy="125" rx="12" ry="16" fill="#334155"/>
  <ellipse cx="230" cy="125" rx="12" ry="16" fill="#334155"/>
  <circle cx="173" cy="120" r="4" fill="#14b8a6"/>
  <circle cx="233" cy="120" r="4" fill="#14b8a6"/>
  <!-- Torso -->
  <path d="M130 210 Q200 190 270 210 L280 380 Q200 400 120 380 Z" fill="url(#bodyGrad)"/>
  <!-- Arms clasped -->
  <path d="M155 240 Q200 280 245 240 L250 320 Q200 340 150 320 Z" fill="#cbd5e1" opacity="0.9"/>
  <!-- Neck -->
  <rect x="185" y="195" width="30" height="30" rx="8" fill="#cbd5e1"/>
  <!-- Accent lines -->
  <line x1="160" y1="260" x2="240" y2="260" stroke="#14b8a6" stroke-width="2" opacity="0.5"/>
  <line x1="170" y1="290" x2="230" y2="290" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
</svg>
