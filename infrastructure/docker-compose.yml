services:
  postgres:
    image: postgres:16
    container_name: voice-negotiator-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voice_negotiator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_negotiator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
