name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice_negotiator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voice_negotiator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/voice_negotiator_test
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install API dependencies
        run: uv sync --directory apps/api

      - name: Run migrations
        run: uv run --directory apps/api alembic upgrade head

      - name: Run API tests
        run: uv run --directory apps/api pytest

  web:
    name: Web lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint:web

      - name: Typecheck shared package
        run: npm run typecheck:shared

      - name: Build web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
